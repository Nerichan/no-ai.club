    <style>
        body {
            background-color: #f0f8ff; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-family: 'Lobster', cursive;
            font-size: clamp(2rem, 7vw, 4rem); 
            color: #2c3e50;
            margin-bottom: 40px;
            line-height: 1.2;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* Стили для блока TG */
        .card-tg:hover { border-color: #3498db; }
        /* Стили для блока Twitch */
        .card-twitch:hover { border-color: #9146FF; }
        .card-tbilove:hover { border-color: #e74c3c; }

        .emoji {
            font-size: 40px;
            margin-right: 20px;
        }

        .text-content {
            text-align: left;
        }

        .text-content span {
            display: block;
            font-weight: 700;
            font-size: 1.2rem;
            color: #2c3e50;
        }

        .text-content p {
            margin: 5px 0 0;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .emoji { font-size: 30px; }
            .text-content span { font-size: 1rem; }
        }
    </style>
</head>
