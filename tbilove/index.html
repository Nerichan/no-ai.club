<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TbiLove — свидания в Тбилиси</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
    <meta name="description" content="Тревел-агентство для женщин. Свидания в Тбилиси — город, вино и правильные знакомства.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-family: 'Lobster', cursive;
            font-size: clamp(2rem, 7vw, 4rem);
            color: #2c3e50;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .card-tg:hover { border-color: #3498db; }
        .emoji {
            font-size: 40px;
            margin-right: 20px;
        }
        .text-content {
            text-align: left;
        }
        .text-content span {
            display: block;
            font-weight: 700;
            font-size: 1.2rem;
            color: #2c3e50;
        }
        .text-content p {
            margin: 5px 0 0;
            color: #7f8c8d;
            font-size: 0.9rem;
        }
        .back {
            display: inline-block;
            margin-top: 30px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back:hover { color: #2c3e50; }
        @media (max-width: 480px) {
            .emoji { font-size: 30px; }
            .text-content span { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TbiLove 🌹</h1>
        <p class="subtitle">Тревел-агентство для женщин.<br>Тбилиси, вино и свидания, которые запоминаются.</p>

        <div class="links-wrapper">
            <a href="https://no-ai.club/tbilove" class="card card-tg" target="_blank">
                <div class="emoji">✈️</div>
                <div class="content text-content">
                    <span>TbiLove</span>
                    <p>Подробности, отзывы и запись.</p>
                </div>
            </a>
        </div>

        <a href="/" class="back">← на главную</a>
    </div>
</body>
</html>
